name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Host-side protocol tests — no ESP-IDF, just gcc + python3 (SPEC.md §7).
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc python3
      - name: Run host tests
        run: bash firmware/test/host/run_tests.sh

  # The REAL ui.c + cable_client.c + LVGL 9.2.2 on a virtual 240×240 panel,
  # driven by a scripted daemon and a scripted finger (SPEC.md §7). Every
  # outbound frame is checked; the screenshots are kept as an artifact.
  ui-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-multilib python3 python3-pil
      - name: Run the UI simulator (device build: 32-bit, the device's LVGL pool)
        run: SIM_DEVICE=1 bash firmware/test/sim/run_sim.sh
      - name: Run the UI simulator (64-bit host build, screenshots)
        run: bash firmware/test/sim/run_sim.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: firmware/test/sim/out/
          retention-days: 14

  # Firmware build in Espressif's official ESP-IDF v5.5 Docker image, through
  # espressif/esp-idf-ci-action (a plain `docker run`, so the image entrypoint
  # that exports the IDF environment still runs — a job `container:` overrides
  # it, and "espressif/idf-install-action" does not exist).
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + size + merged image (DIO)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32c3
          path: firmware
          command: >-
            idf.py set-target esp32c3 &&
            idf.py build &&
            idf.py size &&
            cd build &&
            python -m esptool --chip esp32c3 merge_bin -o harness-c3-merged.bin
            --flash_mode dio --flash_freq 80m --flash_size 4MB
            0x0 bootloader/bootloader.bin
            0x8000 partition_table/partition-table.bin
            0xf000 ota_data_initial.bin
            0x20000 harness-c3.bin
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bins
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/harness-c3.bin
            firmware/build/harness-c3-merged.bin
          retention-days: 14

  # Keep docs/webflasher/bin + manifest.json in sync on every push to main,
  # so the GitHub Pages web flasher always offers the latest main build.
  # Also runnable by hand (Actions → build → Run workflow) to refresh the page.
  webflasher:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [host-tests, ui-sim, firmware]
    concurrency:
      group: webflasher
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bins
          path: /tmp/bins
      - name: Copy binaries into docs/webflasher/bin
        run: |
          mkdir -p docs/webflasher/bin
          # upload-artifact keeps the build tree's sub-folders.
          cp /tmp/bins/bootloader/bootloader.bin docs/webflasher/bin/
          cp /tmp/bins/partition_table/partition-table.bin docs/webflasher/bin/
          cp /tmp/bins/ota_data_initial.bin /tmp/bins/harness-c3.bin docs/webflasher/bin/
      - name: Regenerate manifest.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          version = pathlib.Path("firmware/version.txt").read_text().strip()
          parts = [
              ("bin/bootloader.bin", 0x0000),
              ("bin/partition-table.bin", 0x8000),
              ("bin/ota_data_initial.bin", 0xf000),
              ("bin/harness-c3.bin", 0x20000),
          ]
          manifest = {
              "name": "Harness C3",
              "version": version,
              "new_install_prompt_erase": True,
              "builds": [{
                  "chipFamily": "ESP32-C3",
                  "parts": [{"path": p, "offset": off} for p, off in parts],
              }],
          }
          pathlib.Path("docs/webflasher/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Commit web flasher update
        run: |
          git config user.name "harness-c3-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/webflasher/bin docs/webflasher/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "webflasher: binaries for $(cat firmware/version.txt) ($(git rev-parse --short HEAD))"
          # main may have moved while we built: replay on top, then push.
          git pull --rebase origin main
          git push origin HEAD:main

  # Tagged releases: the 4 raw bins, the merged image and a source zip.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, ui-sim, firmware]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bins
          path: /tmp/bins
      - name: Source zip
        run: git archive --format=zip --prefix=harness-c3/ -o /tmp/harness-c3-source.zip HEAD
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/bins/bootloader/bootloader.bin
            /tmp/bins/partition_table/partition-table.bin
            /tmp/bins/ota_data_initial.bin
            /tmp/bins/harness-c3.bin
            /tmp/bins/harness-c3-merged.bin
            /tmp/harness-c3-source.zip
          generate_release_notes: true
